<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
                Course Registration System
            {% endblock %}
        </title>
        <style>
            header{
                background-color: #064760;
                padding: 20px;
                text-align: center;
            }
            footer{
                background-color: #064760;
                padding: 10px;
                text-align: center;
                color: white;
            }
            nav{
                background-color: #298624;
                padding: 10px;
                text-align: center;
            }
            nav a{
                color: white;
                text-decoration: none;
                margin: 0 10px;
            }
            nav a:hover{
                text-decoration: underline;
            }
        </style>

    </head>
    <body>
        <header>
            <h1 style="color: white;" >Course Registration System</h1>
        </header>
        <nav>
            <a href="{% url 'home'%}">Home</a>
            <a href="{% url 'courses'%}">Courses</a>
            <a href="{% url 'register' %}">Register</a>
        </nav>

        <div class="content" style="padding: 20px; background-color: antiquewhite; ">
            {% block content %}

            {% endblock %}
        </div>
       

        <footer>
            <p> 2024 Course Registration System. All rights reserved.</p>
        </footer>
    </body>
</html>
