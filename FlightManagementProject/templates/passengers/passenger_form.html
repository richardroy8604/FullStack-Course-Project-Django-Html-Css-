{% extends 'base.html' %}

{% block title %}{{ title }} - Flight Management System{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 20px auto; background-color: aliceblue; padding: 25px; border-radius: 8px; border: 1px solid #ccc;">
    <h2 style="color: #064760; text-align: center; margin-top: 0;">{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
            <div style="flex: 1;">
                <label for="id_first_name" style="font-weight: bold;">First Name:</label>
                <input type="text" id="id_first_name" name="first_name" value="{{ form.first_name.value|default:'' }}" required style="width: 100%; padding: 8px; margin-top: 4px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div style="flex: 1;">
                <label for="id_last_name" style="font-weight: bold;">Last Name:</label>
                <input type="text" id="id_last_name" name="last_name" value="{{ form.last_name.value|default:'' }}" required style="width: 100%; padding: 8px; margin-top: 4px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
        </div>

        <div style="margin-bottom: 12px;">
            <label for="id_email" style="font-weight: bold;">Email:</label>
            <input type="email" id="id_email" name="email" value="{{ form.email.value|default:'' }}" required style="width: 100%; padding: 8px; margin-top: 4px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <div style="flex: 1;">
                <label for="id_phone" style="font-weight: bold;">Phone:</label>
                <input type="text" id="id_phone" name="phone" value="{{ form.phone.value|default:'' }}" required style="width: 100%; padding: 8px; margin-top: 4px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div style="flex: 1;">
                <label for="id_passport_number" style="font-weight: bold;">Passport Number:</label>
                <input type="text" id="id_passport_number" name="passport_number" value="{{ form.passport_number.value|default:'' }}" required style="width: 100%; padding: 8px; margin-top: 4px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
        </div>

        <div style="display: flex; justify-content: space-between;">
            <a href="{% url 'passenger_list' %}" class="btn" style="background-color: #6c757d;">Cancel</a>
            <button type="submit" class="btn">Save Passenger</button>
        </div>
    </form>
</div>
{% endblock %}
