{% extends 'base.html' %}

{% block title %}
    {{ title }} - Employee Management System
{% endblock %}

{% block content %}
<div style="background-color: white; padding: 20px; border-radius: 5px; max-width: 500px; margin: auto;">
    <h2 style="color: #064760;">{{ title }}</h2>
    <form method="POST">
        {% csrf_token %}
        <table cellpadding="6" style="width: 100%;">
            {{ form.as_table }}
        </table>
        <br>
        <button type="submit" style="background-color: #298624; color: white; padding: 8px 16px; border: none; cursor: pointer;">Save Employee</button>
        <a href="{% url 'employee_list' %}" style="margin-left: 15px; text-decoration: none; color: #555;">Cancel</a>
    </form>
</div>
{% endblock %}
