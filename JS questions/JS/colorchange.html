
<!DOCTYPE html>
<html>
<head>
    
    <title>Color Change</title>

</head>
<body style="padding-top:20px;">
    <h1 id="text" style="background-color:  rgb(236, 172, 87); border-radius: 8px; padding: 20px; width: 500px;">COLOUR CHANGE</h1>
    <div style="padding: 5px; background-color: rgb(236, 172, 87); border-radius: 10px; display:list-item; width: 530px;">
           <button onclick="changecolor('Red')" id="ch" style="-webkit-text-fill-color: aliceblue; width: 100px;background-color: rgb(248, 74, 74); display: block; font-family: Arial, Helvetica, sans-serif;font-size: large;padding: 5px; border-radius: 8px;"> Red</button>
           <button onclick="changecolor('Blue')" id="ch" onclick="" style="-webkit-text-fill-color: aliceblue;width: 100px;background-color: rgb(7, 76, 226); display: block; font-family: Arial, Helvetica, sans-serif;font-size: large;padding: 5px; border-radius: 8px;"> Blue</button>
           <button onclick="changecolor('Green')" id="ch" onclick="" style="-webkit-text-fill-color: aliceblue;width: 100px;background-color: rgb(56, 226, 56); display: block; font-family: Arial, Helvetica, sans-serif;font-size: large;padding: 5px; border-radius: 8px;"> Green</button>
           
        
    </div>
 <script>
    let button=document.getElementById()
    function changecolor(c)
    {
        document.getElementById("text").style.color=c;
    }
        
 </script>

</body>
</html>
