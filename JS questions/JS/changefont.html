
<!DOCTYPE html>
<html>
<head>
    
    <title>Color Change</title>

</head>
<body style="padding-top:20px;">
    <h1 id="text" style="background-color:  rgb(231, 93, 112); border-radius: 8px; padding: 20px; width: 500px;">FONT SIZE CHANGE</h1>
    <div style="padding: 5px; background-color: rgb(231, 93, 112); border-radius: 10px; display:list-item; width: 530px;">
           <button onclick="changefontsize('48px')" id="ch" style="-webkit-text-fill-color: rgb(5, 5, 5); width: 100px;background-color: rgb(255, 255, 255); display: block; font-family: Arial, Helvetica, sans-serif;font-size: large;padding: 5px; border-radius: 8px;"> Large</button>
           <button onclick="changefontsize('36px')" id="ch" onclick="" style="-webkit-text-fill-color: rgb(2, 2, 2);width: 100px;background-color: rgb(255, 255, 255); display: block; font-family: Arial, Helvetica, sans-serif;font-size: large;padding: 5px; border-radius: 8px;"> Medium</button>
           <button onclick="changefontsize('24px')" id="ch" onclick="" style="-webkit-text-fill-color: rgb(0, 0, 0);width: 100px;background-color: rgb(255, 255, 255); display: block; font-family: Arial, Helvetica, sans-serif;font-size: large;padding: 5px; border-radius: 8px;"> Small</button>
           
    </div>
 <script>
    let button=document.getElementById()
    function changefontsize(c)
    {
        text=document.getElementById("text");
        text.style.fontSize=c;
    }
        
 </script>

</body>
</html>
