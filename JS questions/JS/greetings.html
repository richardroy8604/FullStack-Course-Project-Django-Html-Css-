
<!DOCTYPE html>
<html>
<head>
    
    <title>Simple Page</title>

</head>
<body style="padding-top:20px;">
    <h1 style="background-color:  rgb(63, 180, 216); border-radius: 8px; padding: 20px; width: 500px;">WHATSAPP UNIVERSITY</h1>
    <div style="padding: 5px; background-color: rgb(63, 180, 216); border-radius: 10px; display:list-item; width: 500px;">
           <input type="text" id="name" style="padding: 5px; margin-top: 5px; margin-bottom: 20px; border-radius: 5px;">
           <button onclick="greet()" style="display: block; font-family: Arial, Helvetica, sans-serif;font-size: large;padding: 5px; border-radius: 8px;"> Click Me</button>
            <h1 id="msg"></h1>
        
    </div>
 <script>
    function greet(){
        let name=document.getElementById("name").value;
        document.getElementById("msg").innerHTML="Welcome, "+name+" Have a nice day  "
    }
        
 </script>

</body>
</html>
